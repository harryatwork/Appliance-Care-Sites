<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sure Fix — Book a Repair</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --primary:#FF6B00;
  --primary-dark:#E05F00;
  --primary-light:#FFF1E6;
  --primary-glow: rgba(255,107,0,0.20);
  --ink:#1A1D23;
  --ink-soft:#5B6472;
  --ink-faint:#9AA1AC;
  --gray-bg:#F6F7F9;
  --surface:#FFFFFF;
  --border:#E7E9EE;
  --success:#1D9A5C;
  --success-light:#E8F7EF;
  --danger:#E5484D;
  --danger-light:#FDECEC;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:9px;
  --shadow-sm: 0 1px 3px rgba(16,24,40,0.06), 0 1px 2px rgba(16,24,40,0.04);
  --shadow-md: 0 6px 18px rgba(16,24,40,0.08);
  --shadow-lg: 0 20px 44px rgba(16,24,40,0.14);
  --font-display: 'Plus Jakarta Sans', 'Inter', sans-serif;
  --font-body: 'Inter', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family: var(--font-body);
  background: var(--gray-bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  padding-bottom: 0;
}
button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit;}
input, textarea{font-family:inherit; font-size:15px; color:var(--ink);}
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px;
}
::selection{background:var(--primary-glow);}
img,svg{display:block;}
h1,h2,h3{font-family:var(--font-display); letter-spacing:-0.01em;}

/* ---------- App shell ---------- */
.app-shell{max-width:1180px; margin:0 auto; padding: 0 0 110px;}
@media (min-width:900px){ .app-shell{padding-bottom:56px;} }

.topbar{
  position:sticky; top:0; z-index:40; background:rgba(255,255,255,0.92); backdrop-filter: blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:14px;
  padding:14px 18px;
}
.back-btn{
  width:38px; height:38px; border-radius:50%; background:var(--gray-bg); display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition: background .15s ease, transform .1s ease;
}
.back-btn:hover{background:var(--primary-light); color:var(--primary-dark);}
.back-btn:active{transform:scale(0.92);}
.back-btn svg{width:19px; height:19px;}
.back-btn[disabled]{opacity:0; pointer-events:none;}

.logo{display:flex; align-items:center; gap:9px; flex-shrink:0;}
.logo-mark{
  width:34px; height:34px; border-radius:10px; background:linear-gradient(145deg, var(--primary), var(--primary-dark));
  display:flex; align-items:center; justify-content:center; box-shadow: 0 4px 10px rgba(255,107,0,0.35);
}
.logo-mark svg{width:19px; height:19px; color:#fff;}
.logo-text{font-family:var(--font-display); font-weight:800; font-size:18px; color:var(--ink); white-space:nowrap;}
.logo-text span{color:var(--primary);}

.topbar-meta{flex:1; min-width:0;}
.step-caption{font-size:12px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.06em;}
.step-title{font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
@media (min-width:640px){ .step-title{font-size:16px;} }

.step-pill{
  flex-shrink:0; font-size:12px; font-weight:700; color:var(--primary-dark); background:var(--primary-light);
  padding:6px 12px; border-radius:100px; white-space:nowrap;
}

.progress-track{height:4px; background:var(--border); position:relative; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--primary), var(--primary-dark)); transition: width .45s cubic-bezier(.4,0,.2,1); border-radius:0 4px 4px 0;}

/* desktop stepper */
.desktop-stepper{display:none;}
@media (min-width:900px){
  .desktop-stepper{
    display:flex; align-items:center; justify-content:center; gap:0; padding:22px 24px 4px; max-width:1180px; margin:0 auto;
  }
  .ds-item{display:flex; align-items:center; gap:9px;}
  .ds-dot{
    width:28px; height:28px; border-radius:50%; background:var(--surface); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink-faint);
    transition: all .25s ease; flex-shrink:0;
  }
  .ds-dot.done{background:var(--primary); border-color:var(--primary); color:#fff;}
  .ds-dot.current{border-color:var(--primary); color:var(--primary-dark); box-shadow:0 0 0 4px var(--primary-glow);}
  .ds-label{font-size:12.5px; font-weight:600; color:var(--ink-faint); white-space:nowrap;}
  .ds-item.active .ds-label{color:var(--ink);}
  .ds-line{width:34px; height:2px; background:var(--border); margin:0 6px; border-radius:2px;}
  .ds-line.done{background:var(--primary);}
}

/* ---------- Layout ---------- */
.layout{padding: 22px 18px 0; }
@media (min-width:900px){
  .layout{display:grid; grid-template-columns: 1fr 340px; gap:28px; padding: 26px 24px 0;}
}

.step-panel{animation: fadeSlideIn .35s ease both;}
@keyframes fadeSlideIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

.step-head{margin-bottom:20px;}
.step-eyebrow{font-size:12.5px; font-weight:700; color:var(--primary-dark); text-transform:uppercase; letter-spacing:.07em; margin-bottom:6px;}
.step-heading{font-size:23px; font-weight:800; color:var(--ink); margin-bottom:6px;}
@media (min-width:640px){ .step-heading{font-size:27px;} }
.step-sub{font-size:14.5px; color:var(--ink-soft); line-height:1.5; max-width:520px;}

/* ---------- Option cards (grid) ---------- */
.grid{display:grid; grid-template-columns: repeat(2,1fr); gap:12px;}
@media (min-width:560px){ .grid.appliance-grid{grid-template-columns:repeat(3,1fr);} }
@media (min-width:900px){ .grid.appliance-grid{grid-template-columns:repeat(3,1fr); gap:16px;} }
.grid.problem-grid{grid-template-columns:repeat(2,1fr);}
@media (min-width:560px){ .grid.problem-grid{grid-template-columns:repeat(3,1fr);} }
.grid.type-grid{grid-template-columns:1fr;}
@media (min-width:560px){ .grid.type-grid{grid-template-columns:repeat(2,1fr);} }
.grid.brand-grid{grid-template-columns:repeat(3,1fr);}
@media (min-width:560px){ .grid.brand-grid{grid-template-columns:repeat(4,1fr);} }

.option-card{
  position:relative; background:var(--surface); border:1.5px solid var(--border); border-radius: var(--radius-lg);
  padding:16px 12px 14px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
  box-shadow: var(--shadow-sm); transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
  animation: popIn .4s ease both;
}
@keyframes popIn{ from{opacity:0; transform:scale(.94) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);} }
.option-card:hover{transform:translateY(-3px); box-shadow: var(--shadow-md); border-color:#D9DCE3;}
.option-card:active{transform:translateY(-1px) scale(.98);}
.option-card.selected{
  border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow), var(--shadow-md); background: var(--primary-light);
}
.option-illustration{width:64px; height:64px;}
.option-illustration svg{width:100%; height:100%;}
.option-label{font-size:13.5px; font-weight:700; color:var(--ink); line-height:1.25;}
.option-desc{font-size:11.5px; color:var(--ink-soft); line-height:1.3;}
.check-badge{
  position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%; background:var(--primary);
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(255,107,0,.4);
  animation: checkPop .28s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes checkPop{ from{transform:scale(0); opacity:0;} to{transform:scale(1); opacity:1;} }
.check-badge svg{width:13px; height:13px; color:#fff;}

/* Problem cards - larger illustration */
.problem-card .option-illustration{width:52px; height:52px;}
.problem-card{padding:18px 10px 14px;}

/* Badge style icon (circle bg) for smaller contexts */
.badge-icon{width:52px; height:52px; border-radius:50%; background:var(--primary-light); display:flex; align-items:center; justify-content:center; color:var(--primary);}
.badge-icon svg{width:26px; height:26px;}

/* Type cards - horizontal */
.type-card{
  flex-direction:row; align-items:center; text-align:left; padding:14px 16px; gap:14px;
}
.type-card .badge-icon{width:44px; height:44px; flex-shrink:0;}
.type-card .badge-icon svg{width:22px; height:22px;}
.type-card .type-text{flex:1;}
.type-card .option-label{margin-bottom:2px;}
.type-card .check-badge{position:static; margin-left:auto; flex-shrink:0;}

/* Brand cards */
.brand-card{padding:16px 8px 12px; gap:9px;}
.brand-badge{
  width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:var(--font-display); font-weight:800; font-size:14px; letter-spacing:.02em;
  box-shadow: inset 0 -3px 6px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.12);
}
.brand-card .option-label{font-size:12px;}

/* Skip / helper links */
.skip-link{font-size:13.5px; font-weight:700; color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px;}
.skip-link:hover{color:var(--primary-dark);}

.section-block{margin-top:26px;}
.section-block:first-child{margin-top:0;}
.section-label{font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; display:flex; align-items:center; gap:8px;}

/* ---------- Location step ---------- */
.locate-card{
  background: linear-gradient(135deg, #FFF6EE, #FFFFFF); border:1.5px dashed #FFC98F; border-radius:var(--radius-lg);
  padding:22px 18px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; margin-bottom:22px;
}
.locate-icon{width:56px; height:56px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px rgba(255,107,0,.35);}
.locate-icon svg{width:28px; height:28px; color:#fff;}
.locate-card h3{font-size:16.5px; font-weight:800;}
.locate-card p{font-size:13.5px; color:var(--ink-soft); max-width:340px; line-height:1.5;}
.btn-primary{
  background: linear-gradient(180deg, var(--primary), var(--primary-dark)); color:#fff; font-weight:700; font-size:14.5px;
  padding:13px 26px; border-radius:12px; box-shadow: 0 6px 16px rgba(255,107,0,.32); transition: transform .12s ease, box-shadow .2s ease, opacity .2s ease;
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 9px 20px rgba(255,107,0,.4);}
.btn-primary:active{transform:translateY(0) scale(.98);}
.btn-primary[disabled]{opacity:.42; box-shadow:none; pointer-events:none;}
.btn-primary svg{width:17px; height:17px;}

.detected-card{
  background:var(--success-light); border:1.5px solid #BEE9D2; border-radius:var(--radius-md); padding:14px 16px;
  display:flex; align-items:flex-start; gap:12px; margin-bottom:20px; animation: fadeSlideIn .3s ease both;
}
.detected-card svg{width:20px; height:20px; color:var(--success); flex-shrink:0; margin-top:1px;}
.detected-card .dc-title{font-size:13px; font-weight:700; color:#0F7A47; margin-bottom:2px;}
.detected-card .dc-addr{font-size:13.5px; color:var(--ink); line-height:1.45;}
.detected-card .dc-edit{margin-left:auto; font-size:12.5px; font-weight:700; color:var(--primary-dark); flex-shrink:0;}

.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:7px;}
.field .hint{font-weight:500; color:var(--ink-faint); font-size:12px; margin-left:5px;}
.field input, .field textarea{
  width:100%; border:1.5px solid var(--border); border-radius:var(--radius-md); padding:13px 14px; background:var(--surface);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.field input:focus, .field textarea:focus{border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-glow); outline:none;}
.field textarea{resize:vertical; min-height:78px; line-height:1.5;}

.tag-row{display:flex; gap:10px; flex-wrap:wrap;}
.tag-chip{
  display:flex; align-items:center; gap:7px; padding:10px 16px; border-radius:100px; border:1.5px solid var(--border);
  font-size:13.5px; font-weight:700; color:var(--ink-soft); background:var(--surface); transition: all .15s ease;
}
.tag-chip svg{width:16px; height:16px;}
.tag-chip:hover{border-color:#D9DCE3;}
.tag-chip.selected{border-color:var(--primary); background:var(--primary-light); color:var(--primary-dark); box-shadow:0 0 0 3px var(--primary-glow);}

/* ---------- Modal (location permission) ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,22,26,.5); backdrop-filter:blur(3px); z-index:100;
  display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s ease;
}
@media (min-width:640px){ .modal-overlay{align-items:center;} }
.modal-overlay.open{opacity:1; pointer-events:auto;}
.modal-card{
  background:#fff; border-radius:22px 22px 0 0; width:100%; max-width:420px; padding:30px 26px 26px; text-align:center;
  transform:translateY(40px); transition: transform .3s cubic-bezier(.4,0,.2,1); box-shadow:var(--shadow-lg);
}
@media (min-width:640px){ .modal-card{border-radius:22px; transform:translateY(20px) scale(.97);} }
.modal-overlay.open .modal-card{transform:translateY(0) scale(1);}
.modal-pin{width:76px; height:76px; margin:0 auto 16px; border-radius:50%; background:var(--primary-light); display:flex; align-items:center; justify-content:center; position:relative;}
.modal-pin svg{width:38px; height:38px; color:var(--primary);}
.modal-pin::after{content:''; position:absolute; inset:-8px; border-radius:50%; border:2px solid var(--primary-glow); animation:ringPulse 1.8s ease-out infinite;}
@keyframes ringPulse{0%{transform:scale(.85); opacity:.9;} 100%{transform:scale(1.35); opacity:0;}}
.modal-card h3{font-size:18px; font-weight:800; margin-bottom:8px;}
.modal-card p{font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin-bottom:22px;}
.modal-actions{display:flex; flex-direction:column; gap:10px;}
.btn-ghost{
  padding:12px 20px; border-radius:12px; font-weight:700; font-size:14px; color:var(--ink-soft); background:var(--gray-bg);
  transition: background .15s ease;
}
.btn-ghost:hover{background:#ECEEF1;}
.spinner{width:16px; height:16px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Date & time ---------- */
.date-row{display:grid; grid-template-columns:repeat(5,1fr); gap:9px; margin-bottom:22px;}
@media (max-width:480px){ .date-row{grid-template-columns:repeat(3,1fr); } .date-row .date-card:nth-child(4),.date-row .date-card:nth-child(5){grid-column:span 1;} }
.date-card{
  background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-md); padding:12px 6px;
  display:flex; flex-direction:column; align-items:center; gap:3px; transition: all .15s ease;
}
.date-card:hover{border-color:#D9DCE3; transform:translateY(-2px);}
.date-card.selected{border-color:var(--primary); background:var(--primary-light); box-shadow:0 0 0 3px var(--primary-glow);}
.date-card .dow{font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase;}
.date-card.selected .dow{color:var(--primary-dark);}
.date-card .dnum{font-size:18px; font-weight:800; color:var(--ink);}
.date-card .dmon{font-size:10.5px; color:var(--ink-faint); font-weight:600;}
.date-card.custom{color:var(--primary-dark);}
.date-card.custom svg{width:18px; height:18px; margin-bottom:2px;}

.calendar-panel{background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-lg); padding:18px; margin-bottom:22px; animation:fadeSlideIn .25s ease both;}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.cal-head .cal-title{font-size:15px; font-weight:800;}
.cal-nav{display:flex; gap:6px;}
.cal-nav button{width:30px; height:30px; border-radius:50%; background:var(--gray-bg); display:flex; align-items:center; justify-content:center;}
.cal-nav button:hover{background:var(--primary-light); color:var(--primary-dark);}
.cal-nav button svg{width:15px; height:15px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; text-align:center;}
.cal-dow{font-size:11px; font-weight:700; color:var(--ink-faint); padding:6px 0;}
.cal-day{
  aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:10px; font-size:13.5px; font-weight:600;
  color:var(--ink); transition: all .12s ease;
}
.cal-day:hover:not(.disabled):not(.empty){background:var(--primary-light); color:var(--primary-dark);}
.cal-day.disabled{color:var(--ink-faint); opacity:.35; pointer-events:none;}
.cal-day.empty{pointer-events:none;}
.cal-day.selected{background:var(--primary); color:#fff; box-shadow:0 4px 10px rgba(255,107,0,.35);}

.slot-group{margin-bottom:20px;}
.slot-group-title{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:10px;}
.slot-group-title svg{width:17px; height:17px; color:var(--primary);}
.slot-wrap{display:flex; flex-wrap:wrap; gap:9px;}
.slot-chip{
  padding:10px 15px; border-radius:10px; border:1.5px solid var(--border); font-size:13px; font-weight:700; color:var(--ink-soft);
  background:var(--surface); transition: all .15s ease;
}
.slot-chip:hover:not([disabled]){border-color:#D9DCE3; color:var(--ink);}
.slot-chip.selected{border-color:var(--primary); background:var(--primary); color:#fff; box-shadow:0 4px 10px rgba(255,107,0,.3);}
.slot-chip[disabled]{color:var(--ink-faint); text-decoration:line-through; opacity:.5; cursor:not-allowed; background:var(--gray-bg);}

/* ---------- Contact / OTP ---------- */
.phone-input-row{display:flex; gap:10px;}
.phone-prefix{
  display:flex; align-items:center; padding:0 14px; border:1.5px solid var(--border); border-radius:var(--radius-md);
  font-weight:700; color:var(--ink-soft); background:var(--gray-bg); flex-shrink:0;
}
.otp-box-row{display:flex; gap:10px; margin:6px 0 8px;}
.otp-box{
  width:52px; height:58px; text-align:center; font-size:22px; font-weight:800; border:1.5px solid var(--border);
  border-radius:var(--radius-md); background:var(--surface);
}
.otp-box.error{border-color:var(--danger); background:var(--danger-light); animation: shake .4s ease;}
.otp-box.success{border-color:var(--success); background:var(--success-light);}
@keyframes shake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }
.otp-meta{display:flex; align-items:center; justify-content:space-between; margin-top:4px; margin-bottom:6px;}
.otp-timer{font-size:12.5px; color:var(--ink-faint); font-weight:600;}
.otp-resend{font-size:12.5px; font-weight:700; color:var(--primary-dark);}
.otp-resend[disabled]{color:var(--ink-faint); pointer-events:none;}
.otp-error-msg{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--danger); margin-top:6px;}
.otp-error-msg svg{width:16px; height:16px; flex-shrink:0;}
.otp-hint{font-size:12px; color:var(--ink-faint); margin-top:14px; background:var(--gray-bg); padding:9px 12px; border-radius:9px; display:inline-block;}
.otp-success-msg{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--success); margin-top:6px;}
.otp-success-msg svg{width:16px; height:16px;}

/* ---------- Buttons / nav ---------- */
.nav-buttons{
  display:flex; align-items:center; gap:12px; margin-top:32px; padding-top:22px; border-top:1px solid var(--border);
}
.btn-secondary{
  padding:13px 22px; border-radius:12px; font-weight:700; font-size:14.5px; color:var(--ink); background:var(--surface);
  border:1.5px solid var(--border); transition: all .15s ease;
}
.btn-secondary:hover{border-color:#D9DCE3; background:var(--gray-bg);}
.nav-buttons .btn-primary{flex:1; padding:14px 22px;}
.nav-spacer{flex:1;}

/* sticky mobile nav */
@media (max-width:899px){
  .step-panel > .nav-buttons{display:none;}
  .mobile-nav{
    position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--border); z-index:50;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow:0 -6px 18px rgba(16,24,40,.06);
  }
}
@media (min-width:900px){ .mobile-nav{display:none;} }

/* ---------- Summary ---------- */
.summary-desktop{display:none;}
@media (min-width:900px){
  .summary-desktop{
    display:block; position:sticky; top:88px; align-self:start; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow-sm); max-height:calc(100vh - 120px); overflow:auto;
  }
}
.summary-title{font-size:14.5px; font-weight:800; margin-bottom:4px;}
.summary-note{font-size:12px; color:var(--ink-faint); margin-bottom:16px;}
.summary-row{display:flex; gap:11px; padding:10px 0; border-bottom:1px solid var(--border);}
.summary-row:last-child{border-bottom:none;}
.summary-row .sr-icon{width:32px; height:32px; border-radius:9px; background:var(--gray-bg); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--primary);}
.summary-row .sr-icon svg{width:16px; height:16px;}
.summary-row .sr-text{min-width:0;}
.summary-row .sr-label{font-size:11px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
.summary-row .sr-val{font-size:13.5px; font-weight:700; color:var(--ink); word-break:break-word;}
.summary-row .sr-val.empty{color:var(--ink-faint); font-weight:500;}
.summary-help{margin-top:16px; background:var(--primary-light); border-radius:12px; padding:13px 14px; display:flex; gap:10px; align-items:flex-start;}
.summary-help svg{width:17px; height:17px; color:var(--primary-dark); flex-shrink:0; margin-top:1px;}
.summary-help p{font-size:12px; color:#8A4300; line-height:1.5;}

.summary-mobile-bar{
  position:fixed; left:0; right:0; bottom:66px; z-index:45; background:#fff; border-top:1px solid var(--border);
  padding:10px 16px; display:flex; align-items:center; gap:10px; box-shadow:0 -2px 10px rgba(16,24,40,.04);
  transition: transform .2s ease;
}
@media (min-width:900px){ .summary-mobile-bar{display:none;} }
.summary-mobile-bar .smb-text{flex:1; min-width:0; font-size:12.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.summary-mobile-bar .smb-chevron{width:22px; height:22px; flex-shrink:0; color:var(--ink-faint); transition: transform .2s ease;}
.summary-mobile-bar.open .smb-chevron{transform:rotate(180deg);}

.summary-sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:60; background:#fff; border-radius:20px 20px 0 0; box-shadow:var(--shadow-lg);
  padding:18px 18px calc(90px + env(safe-area-inset-bottom)); transform:translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); max-height:70vh; overflow:auto;
}
.summary-sheet.open{transform:translateY(0);}
@media (min-width:900px){ .summary-sheet{display:none;} }
.sheet-handle{width:38px; height:4px; background:var(--border); border-radius:4px; margin:0 auto 14px;}

/* ---------- Confirmation ---------- */
.confirm-wrap{max-width:520px; margin:20px auto 0; text-align:center; padding:0 6px;}
.confirm-check{
  width:88px; height:88px; border-radius:50%; background:var(--success-light); display:flex; align-items:center; justify-content:center;
  margin:0 auto 22px; position:relative;
}
.confirm-check svg{width:44px; height:44px; color:var(--success);}
.confirm-check::after{content:''; position:absolute; inset:-10px; border-radius:50%; border:2px solid #BEE9D2; animation:ringPulse 1.6s ease-out 1;}
.confirm-title{font-size:25px; font-weight:800; margin-bottom:8px;}
.confirm-sub{font-size:14.5px; color:var(--ink-soft); line-height:1.55; margin-bottom:8px;}
.confirm-id{display:inline-block; font-size:13px; font-weight:700; color:var(--primary-dark); background:var(--primary-light); padding:7px 16px; border-radius:100px; margin-bottom:26px;}
.confirm-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; text-align:left; box-shadow:var(--shadow-sm); margin-bottom:16px;}
.confirm-eta{
  display:flex; align-items:center; gap:12px; background:linear-gradient(135deg,#FFF6EE,#fff); border:1px solid #FFDDB8; border-radius:var(--radius-md);
  padding:14px 16px; margin-bottom:22px; text-align:left;
}
.confirm-eta svg{width:24px; height:24px; color:var(--primary); flex-shrink:0;}
.confirm-eta .ce-title{font-size:13.5px; font-weight:700;}
.confirm-eta .ce-sub{font-size:12px; color:var(--ink-soft);}
.confirm-actions{display:flex; flex-direction:column; gap:10px;}
.confirm-support{margin-top:22px; font-size:12.5px; color:var(--ink-faint);}
.confirm-support a{color:var(--primary-dark); font-weight:700; text-decoration:none;}

.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}

@media (prefers-reduced-motion: reduce){

}

const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function toChoice(d, idx){
  const label = idx===0 ? 'Today' : idx===1 ? 'Tomorrow' : DOW[d.getDay()];
  return {label, dow: DOW[d.getDay()], dnum:d.getDate(), dmon:MON[d.getMonth()], iso:d.toDateString()};
}
function quickDates(){
  const today = new Date();
  return [0,1,2,3].map(i=>toChoice(addDays(today,i), i));
}

    'data-action="'+action+'" data-value="'+value+'" aria-pressed="'+(selected?'true':'false')+'" '+

    (selected ? '<span class="check-badge">'+ICN.check+'</span>' : '') +
    '<span class="option-illustration">'+illustration+'</span>' +
    '<span class="option-label">'+label+'</span>' +
    (desc ? '<span class="option-desc">'+desc+'</span>' : '') +
    '</button>';
}

function buildCalendarGrid(){
  const today = new Date();
  const base = new Date(today.getFullYear(), today.getMonth()+state.calMonthOffset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += '<div class="cal-day empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const cellDate = new Date(year, month, d);
    const isPast = cellDate < new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const iso = cellDate.toDateString();
    const selected = state.dateChoice && state.dateChoice.iso===iso && state.dateChoice.fromCalendar;
    cells += '<div class="cal-day '+(isPast?'disabled':'')+' '+(selected?'selected':'')+'" '+
      (isPast ? '' : 'data-action="select-calendar-day" data-value="'+iso+'"') +'>'+d+'</div>';
  }
  const monthLabel = base.toLocaleString('en-US',{month:'long'})+' '+year;
  return '<div class="calendar-panel">'+
    '<div class="cal-head"><span class="cal-title">'+monthLabel+'</span>'+
    '<div class="cal-nav">'+
    '<button type="button" data-action="cal-prev" '+(state.calMonthOffset<=0?'style="opacity:.3;pointer-events:none"':'')+'>'+ICN.chevronLeft+'</button>'+
    '<button type="button" data-action="cal-next">'+ICN.chevronRight+'</button>'+
    '</div></div>'+
    '<div class="cal-grid">'+DOW.map(d=>'<div class="cal-dow">'+d+'</div>').join('')+cells+'</div>'+
    '</div>';
}

    {icon:ICN.alert, label:'Problem', val: state.problemId ? P[state.problemId].label : null},
    {icon:ICN.pin, label:'Address', val: state.location.address || null},
    {icon:ICN.calendar, label:'Date', val: dc ? dc.label+', '+dc.dnum+' '+dc.dmon : null},
    {icon:ICN.clock, label:'Time slot', val: state.time},
  ];
  return rows.map(r=>'<div class="summary-row"><span class="sr-icon">'+r.icon+'</span>'+
    '<span class="sr-text"><span class="sr-label">'+r.label+'</span><br/><span class="sr-val '+(r.val?'':'empty')+'">'+(r.val?esc(r.val):'Not selected yet')+'</span></span></div>').join('');
}
function renderSummaryDesktop(){
  return '<div class="summary-title">Your booking</div>'+
    '<div class="summary-note">Updates as you go</div>'+
    summaryRowsHtml()+
    '<div class="summary-help">'+ICN.shield+'<p>Free diagnosis, genuine spare parts and a service warranty on every repair.</p></div>';
}
function summaryCondensedText(){
  const a = currentAppliance();
  const parts = [a?a.name:null, state.typeName, state.problemId?P[state.problemId].label:null].filter(Boolean);
  return parts.length ? parts.join(' · ') : 'Your booking summary';
}

/* ============================= NAV LOGIC ============================= */
function canProceed(){
  const key = STEPS[state.stepIndex].key;
  if(key==='appliance') return !!state.applianceId;
  if(key==='type') return !!state.typeName;
  if(key==='brand') return true;
  if(key==='problem') return !!state.problemId;
  if(key==='location') return !!state.location.address && state.location.address.trim().length>4;
  if(key==='datetime') return !!state.dateChoice && !!state.time;
  if(key==='contact'){
    if(!state.contact.otpSent) return false;
    if(state.contact.verified) return true;
    return state.contact.otp.every(d=>d!=='');
  }
  return true;
}
function goNext(){
  if(state.stepIndex < STEPS.length-1){
    state.stepIndex++;
  } else {
    state.bookingId = 'SF' + Math.floor(100000+Math.random()*900000);
    state.stepIndex = STEPS.length; // confirmation
  }
  window.scrollTo({top:0, behavior:'smooth'});
  render();
}
function goBack(){
  if(state.stepIndex>0){ state.stepIndex--; window.scrollTo({top:0,behavior:'smooth'}); render(); }
}
function restart(){
  state.stepIndex=0; state.applianceId=null; state.typeName=null; state.brandId=null; state.problemId=null;
  state.location={mode:null,address:'',landmark:'',notes:'',tag:'Home'}; state.dateChoice=null; state.time=null;
  state.calendarOpen=false; state.calMonthOffset=0;
  state.contact={name:'',mobile:'',otpSent:false,otp:['','','',''],error:false,verified:false,timer:30,verifying:false};
  state.bookingId=null;
  clearInterval(timerHandle);
  window.scrollTo({top:0}); render();
}

/* ============================= MAIN RENDER ============================= */
function renderHeader(){
  const isConfirm = state.stepIndex >= STEPS.length;
  const step = isConfirm ? null : STEPS[state.stepIndex];
  const pct = isConfirm ? 100 : Math.round(((state.stepIndex+1)/STEPS.length)*100);
  return '<div class="topbar"><div class="topbar-inner">'+
    '<button type="button" class="back-btn" data-action="back" '+(state.stepIndex===0||isConfirm?'disabled':'')+' aria-label="Go back">'+ICN.chevronLeft+'</button>'+
    (state.stepIndex===0 ? '<div class="logo"><div class="logo-mark">'+ICN.logoMark+'</div><div class="logo-text">Sure<span>Fix</span></div></div>' :
      '<div class="topbar-meta"><div class="step-caption">'+(isConfirm?'All done':step.eyebrow+' of '+STEPS.length)+'</div><div class="step-title">'+(isConfirm?'Booking confirmed':step.label)+'</div></div>') +
    (!isConfirm ? '<span class="step-pill">'+(state.stepIndex+1)+' / '+STEPS.length+'</span>' : '') +
    '</div>'+
    '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
    '</div>'+
    renderDesktopStepper(isConfirm);
}
function renderDesktopStepper(isConfirm){
  let html = '<div class="desktop-stepper">';
  STEPS.forEach((s,i)=>{
    const done = isConfirm || i<state.stepIndex;
    const current = !isConfirm && i===state.stepIndex;
    html += '<div class="ds-item '+(done||current?'active':'')+'">'+
      '<span class="ds-dot '+(done?'done':'')+' '+(current?'current':'')+'">'+(done?ICN.check:i+1)+'</span>'+
      '<span class="ds-label">'+s.label+'</span></div>';
    if(i<STEPS.length-1) html += '<span class="ds-line '+(done?'done':'')+'"></span>';
  });
  html += '</div>';
  return html;
}

function stepBodyHtml(){
  const key = STEPS[state.stepIndex] ? STEPS[state.stepIndex].key : null;
  if(key==='appliance') return renderApplianceStep();
  if(key==='type') return renderTypeStep();
  if(key==='brand') return renderBrandStep();
  if(key==='problem') return renderProblemStep();
  if(key==='location') return renderLocationStep();
  if(key==='datetime') return renderDateTimeStep();
  if(key==='contact') return renderContactStep();
  return '';
}

function renderMain(){
  const isConfirm = state.stepIndex >= STEPS.length;
  if(isConfirm){
    return '<div class="layout" style="grid-template-columns:1fr">'+
      '<div class="step-panel">'+renderConfirmationStep()+'</div></div>';
  }
  const step = STEPS[state.stepIndex];
  const isLast = state.stepIndex === STEPS.length-1;
  const nextLabel = isLast ? 'Verify & confirm booking' : 'Continue';
  const proceed = canProceed();
  const showSkip = step.key==='brand';

  const body = '<div class="step-panel">'+
    '<div class="step-head"><div class="step-eyebrow">'+step.eyebrow+' of '+STEPS.length+'</div>'+
    '<h1 class="step-heading">'+step.heading+'</h1><p class="step-sub">'+step.sub+'</p></div>'+
    stepBodyHtml()+
    '<div class="nav-buttons">'+
      (state.stepIndex>0 ? '<button type="button" class="btn-secondary" data-action="back">Back</button>' : '<span></span>') +
      '<span class="nav-spacer"></span>'+
      (showSkip ? '' : '') +
      '<button type="button" class="btn-primary" data-action="next" '+(proceed?'':'disabled')+'>'+nextLabel+' '+ICN.chevronRight+'</button>'+
    '</div>'+
    '</div>';

  const sidebar = '<aside class="summary-desktop">'+renderSummaryDesktop()+'</aside>';

  return '<div class="layout">'+body+sidebar+'</div>'+
    '<div class="summary-mobile-bar '+(state.summarySheetOpen?'open':'')+'" data-action="toggle-summary-sheet">'+
      '<span class="smb-text">'+esc(summaryCondensedText())+'</span><span class="smb-chevron">'+ICN.chevronDown+'</span>'+
    '</div>'+
    '<div class="summary-sheet '+(state.summarySheetOpen?'open':'')+'"><div class="sheet-handle"></div>'+renderSummaryDesktop()+'</div>'+
    '<div class="mobile-nav">'+
      '<div style="display:flex;gap:10px">'+
      (state.stepIndex>0 ? '<button type="button" class="btn-secondary" data-action="back" style="flex:0 0 auto">Back</button>' : '') +
      '<button type="button" class="btn-primary" style="flex:1" data-action="next" '+(proceed?'':'disabled')+'>'+nextLabel+'</button>'+
      '</div></div>';
}

function renderLocationModal(){
  const m = state.showLocationModal;
  return '<div class="modal-overlay '+(m?'open':'')+'" data-action="close-modal-bg">'+
    '<div class="modal-card" onclick="event.stopPropagation()">'+
    '<div class="modal-pin">'+ICN.pin+'</div>'+
    '<h3>'+(state.locationLoading?'Finding your location…':'Allow location access')+'</h3>'+
    '<p>'+(state.locationLoading?'Hold on while we pin your exact address for faster technician assignment.':'Sure Fix uses your location only to find the nearest available technician and estimate arrival time.')+'</p>'+
    (state.locationLoading ?
      '<div style="display:flex;justify-content:center"><span class="spinner" style="border-top-color:#FF6B00;border-color:rgba(255,107,0,.25)"></span></div>' :
      '<div class="modal-actions">'+
      '<button type="button" class="btn-primary" data-action="allow-location">'+ICN.pin+' Allow and detect</button>'+
      '<button type="button" class="btn-ghost" data-action="manual-address">Enter address manually</button>'+
      '</div>') +
    '</div></div>';
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="app-shell">'+renderHeader()+renderMain()+'</div>'+renderLocationModal();
  attachDynamicListeners();
}

/* ============================= EVENTS ============================= */
function attachDynamicListeners(){
  // OTP boxes
  document.querySelectorAll('.otp-box').forEach(box=>{
    box.addEventListener('input', e=>{
      const i = +box.dataset.otpIndex;
      const v = e.target.value.replace(/[^0-9]/g,'').slice(-1);
      state.contact.otp[i] = v;
      state.contact.error = false;
      if(v && i<3){ const next = document.querySelector('.otp-box[data-otp-index="'+(i+1)+'"]'); if(next) next.focus(); }
      if(state.contact.otp.every(d=>d!=='') ){ /* wait for explicit confirm click */ }
      syncOtpBoxesVisualOnly();
    });
    box.addEventListener('keydown', e=>{
      const i = +box.dataset.otpIndex;
      if(e.key==='Backspace' && !box.value && i>0){
        const prev = document.querySelector('.otp-box[data-otp-index="'+(i-1)+'"]'); if(prev) prev.focus();
      }
    });
  });
}
function syncOtpBoxesVisualOnly(){ /* keep values without full re-render to preserve focus */ }

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const value = el.dataset.value;

  if(action==='back') return goBack();
  if(action==='next') { if(!el.disabled) goNext(); return; }
  if(action==='restart') return restart();
  if(action==='noop') return;

  if(action==='select-appliance'){
    state.applianceId = value; state.typeName=null; state.problemId=null; return render();
  }
  if(action==='select-type'){ state.typeName = value; return render(); }
  if(action==='select-brand'){ state.brandId = value; return render(); }
  if(action==='skip-brand'){ state.brandId='Other'; return goNext(); }
  if(action==='select-problem'){ state.problemId = value; return render(); }

  if(action==='open-location-modal'){ state.showLocationModal = true; state.locationLoading=false; return render(); }
  if(action==='close-modal-bg'){ if(e.target.dataset.action==='close-modal-bg'){ state.showLocationModal=false; return render(); } }
  if(action==='allow-location'){
    state.locationLoading = true; render();
    setTimeout(()=>{
      state.location.mode='auto';
      state.location.address = '221, 100 Feet Road, Indiranagar, Bengaluru, Karnataka 560038';
      state.showLocationModal=false; state.locationLoading=false;
      render();
    }, 1300);
    return;
  }
  if(action==='manual-address'){ state.showLocationModal=false; state.location.mode='manual'; return render(); }
  if(action==='select-tag'){ state.location.tag = value; return render(); }

  if(action==='select-quick-date'){
    const d = quickDates()[+value]; state.dateChoice = Object.assign({}, d, {fromCalendar:false}); state.calendarOpen=false; return render();
  }
  if(action==='toggle-calendar'){ state.calendarOpen = !state.calendarOpen; return render(); }
  if(action==='cal-prev'){ if(state.calMonthOffset>0) state.calMonthOffset--; return render(); }
  if(action==='cal-next'){ state.calMonthOffset++; return render(); }
  if(action==='select-calendar-day'){
    const d = new Date(value);
    state.dateChoice = {label: d.toLocaleDateString('en-US',{weekday:'short'}), dow:DOW[d.getDay()], dnum:d.getDate(), dmon:MON[d.getMonth()], iso:d.toDateString(), fromCalendar:true};
    return render();
  }
  if(action==='select-time'){ if(!el.disabled){ state.time = value; render(); } return; }

  if(action==='send-otp'){
    state.contact.otpSent = true; state.contact.timer=30; state.contact.otp=['','','',''];
    startOtpTimer(); render();
    setTimeout(()=>{ const first=document.querySelector('.otp-box[data-otp-index="0"]'); if(first) first.focus(); }, 60);
    return;
  }
  if(action==='resend-otp'){ state.contact.timer=30; state.contact.otp=['','','',''];state.contact.error=false; startOtpTimer(); return render(); }
  if(action==='change-number'){ state.contact.otpSent=false; state.contact.verified=false; state.contact.otp=['','','','']; clearInterval(timerHandle); return render(); }

  if(action==='toggle-summary-sheet'){ state.summarySheetOpen = !state.summarySheetOpen; return render(); }
});

// Confirm booking uses the shared Next/Continue button once on contact step but OTP must be verified first via explicit verify tap on the input row's implicit check.
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action="next"]');
  if(!el) return;
  const key = STEPS[state.stepIndex] && STEPS[state.stepIndex].key;
  if(key==='contact' && state.contact.otpSent && !state.contact.verified){
    e.stopImmediatePropagation();
    verifyOtp();
  }
}, true);

function verifyOtp(){
  const code = state.contact.otp.join('');
  if(code.length<4) return;
  if(code==='1234'){
    state.contact.verified = true; state.contact.error=false;
    render();
    setTimeout(()=>{ goNext(); }, 550);
  } else {
    state.contact.error = true; state.contact.otp=['','','',''];
    render();
    setTimeout(()=>{ const first=document.querySelector('.otp-box[data-otp-index="0"]'); if(first) first.focus(); }, 60);
  }
}

function startOtpTimer(){
  clearInterval(timerHandle);
  timerHandle = setInterval(()=>{
    if(state.contact.timer>0){ state.contact.timer--; updateTimerDom(); }
    else clearInterval(timerHandle);
  }, 1000);
}
function updateTimerDom(){
  const el = document.querySelector('.otp-timer');
  const resend = document.querySelector('.otp-resend');
  if(el) el.textContent = state.contact.timer>0 ? 'Resend code in 00:'+String(state.contact.timer).padStart(2,'0') : '';
  if(resend){ if(state.contact.timer<=0) resend.removeAttribute('disabled'); }
}

document.addEventListener('input', function(e){
  const field = e.target.dataset && e.target.dataset.field;
  if(!field) return;
  if(field==='address'){ state.location.address = e.target.value; syncSummaryOnly(); }
  else if(field==='landmark'){ state.location.landmark = e.target.value; }
  else if(field==='notes'){ state.location.notes = e.target.value; }
  else if(field==='name'){ state.contact.name = e.target.value; syncNextButton(); }
  else if(field==='mobile'){ e.target.value = e.target.value.replace(/[^0-9]/g,'').slice(0,10); state.contact.mobile = e.target.value; syncNextButton(); }
});
function syncSummaryOnly(){
  document.querySelectorAll('.summary-row .sr-val').forEach(()=>{});
  const rows = document.querySelectorAll('.summary-desktop .summary-row, .summary-sheet .summary-row');
  // lightweight refresh of summary text without full rerender (avoid stealing focus)
  const a = currentAppliance(); const dc = state.dateChoice; const brand = BRANDS.find(b=>b.id===state.brandId);
  const vals = [ a?a.name:null, state.typeName, state.brandId?(brand?brand.name:'Other / Not Sure'):null,
    state.problemId?P[state.problemId].label:null, state.location.address||null,
    dc?dc.label+', '+dc.dnum+' '+dc.dmon:null, state.time ];
  rows.forEach(row=>{});
  const groups = [document.querySelectorAll('.summary-desktop .sr-val'), document.querySelectorAll('.summary-sheet .sr-val')];
  groups.forEach(g=>{ g.forEach((el,i)=>{ if(vals[i]!==undefined){ el.textContent = vals[i] || 'Not selected yet'; el.classList.toggle('empty', !vals[i]); } }); });
  const bar = document.querySelector('.smb-text'); if(bar) bar.textContent = summaryCondensedText();
  syncNextButton();
}
function syncNextButton(){
  const btns = document.querySelectorAll('[data-action="next"]');
  const ok = canProceed();
  btns.forEach(b=>{ if(ok) b.removeAttribute('disabled'); else b.setAttribute('disabled','true'); });
  const sendBtn = document.querySelector('[data-action="send-otp"]');
  if(sendBtn){ const canSend = state.contact.name.trim().length>1 && state.contact.mobile.length===10; if(canSend) sendBtn.removeAttribute('disabled'); else sendBtn.setAttribute('disabled','true'); }
}

/* keep otp state synced to model on each input already handled above via attachDynamicListeners */

render();
</script>
</body>
</html>
