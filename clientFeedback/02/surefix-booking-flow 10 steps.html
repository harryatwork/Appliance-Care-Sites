<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sure Fix — Book a Repair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF6B00;
  --orange-dark:#DE5900;
  --orange-light:#FFF1E6;
  --orange-glow:rgba(255,107,0,.20);
  --bg:#FFFFFF;
  --surface:#F7F7F9;
  --surface-2:#FBFBFC;
  --border:#E9E9EE;
  --border-strong:#DEDEE4;
  --text:#17171B;
  --text-muted:#6B6B76;
  --text-faint:#A1A1AA;
  --success:#16A34A;
  --success-bg:#EEFBF3;
  --danger:#E5484D;
  --danger-bg:#FDECEC;
  --r-lg:16px;
  --r-md:12px;
  --r-sm:8px;
  --shadow-sm:0 1px 2px rgba(20,20,25,.05);
  --shadow-md:0 10px 30px -12px rgba(20,20,25,.16);
  --shadow-orange:0 10px 26px -10px rgba(255,107,0,.45);
  --header-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--surface);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  line-height:1.45;
}
h1,h2,h3,h4,.font-display{font-family:'Sora',sans-serif;}
button{font-family:inherit;}
img,svg{display:block;}
.icon{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px;border-radius:4px;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  height:var(--header-h);
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
}
.topbar-inner{
  max-width:1220px;margin:0 auto;width:100%;
  padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.logo{display:flex;align-items:center;gap:9px;font-family:'Sora';font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--text);text-decoration:none;}
.logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--orange),#FF8A3D);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-orange);}
.logo-mark svg{width:18px;height:18px;stroke:#fff;}
.logo small{color:var(--orange);}
.topbar-meta{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--text-muted);}
.trust-chip{display:flex;align-items:center;gap:6px;}
.trust-chip svg{width:14px;height:14px;stroke:var(--orange);fill:var(--orange);}
.call-btn{display:flex;align-items:center;gap:7px;background:var(--orange-light);color:var(--orange-dark);border:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap;}
@media (max-width:720px){ .topbar-meta .trust-chip{display:none;} }

/* ---------- Progress ---------- */
.progress-wrap{
  position:sticky; top:var(--header-h); z-index:35;
  background:#fff;border-bottom:1px solid var(--border);
}
.progress-inner{max-width:1220px;margin:0 auto;padding:14px 20px 12px;}
.progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.progress-label{font-size:12.5px;font-weight:600;color:var(--text-muted);letter-spacing:.02em;text-transform:uppercase;}
.progress-pct{font-size:12.5px;font-weight:700;color:var(--orange);}
.progress-track{position:relative;height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.progress-fill{position:absolute;inset:0 auto 0 0;width:0%;background:linear-gradient(90deg,var(--orange),#FF8A3D);border-radius:99px;transition:width .45s cubic-bezier(.65,0,.35,1);}
.step-nodes{display:none;}
@media (min-width:860px){
  .progress-track{display:none;}
  .step-nodes{display:flex;align-items:flex-start;justify-content:space-between;position:relative;margin-top:4px;}
  .step-nodes::before{content:'';position:absolute;top:13px;left:22px;right:22px;height:2px;background:var(--border);z-index:0;}
  .step-nodes::after{content:'';position:absolute;top:13px;left:22px;height:2px;background:var(--orange);z-index:1;width:var(--fill,0%);transition:width .45s cubic-bezier(.65,0,.35,1);}
  .step-node{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
  .node-dot{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--text-faint);transition:all .25s ease;}
  .node-label{font-size:10.5px;color:var(--text-faint);font-weight:600;text-align:center;max-width:76px;}
  .step-node.done .node-dot{background:var(--orange);border-color:var(--orange);color:#fff;}
  .step-node.done .node-dot svg{width:12px;height:12px;stroke:#fff;stroke-width:3;}
  .step-node.active .node-dot{border-color:var(--orange);color:var(--orange);box-shadow:0 0 0 5px var(--orange-glow);background:#fff;}
  .step-node.active .node-label{color:var(--orange);}
}

/* ---------- Layout ---------- */
.shell{max-width:1220px;margin:0 auto;padding:28px 20px 130px;}
.flow-grid{display:grid;grid-template-columns:1fr;gap:24px;align-items:start;}
@media (min-width:960px){
  .flow-grid{grid-template-columns:1fr 360px;gap:32px;}
  .shell{padding-bottom:48px;}
}
.main-col{min-width:0;}
.step-head{margin-bottom:22px;}
.step-eyebrow{font-size:12.5px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;}
.step-title{font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em;}
.step-sub{font-size:14.5px;color:var(--text-muted);margin:0;max-width:60ch;}
@media (min-width:720px){ .step-title{font-size:30px;} }

.card-panel{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow-sm);}

/* ---------- Option grids / cards ---------- */
.option-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.option-grid.cols-3{grid-template-columns:repeat(2,1fr);}
.option-grid.cols-brand{grid-template-columns:repeat(2,1fr);}
.option-grid.cols-wide{grid-template-columns:1fr;}
@media (min-width:560px){
  .option-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .option-grid.cols-brand{grid-template-columns:repeat(3,1fr);}
}
@media (min-width:960px){
  .option-grid{grid-template-columns:repeat(3,1fr);}
  .option-grid.cols-brand{grid-template-columns:repeat(4,1fr);}
}

.option-card{
  position:relative;background:#fff;border:1.5px solid var(--border);border-radius:var(--r-lg);
  padding:18px 14px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
  cursor:pointer;transition:transform .16s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.option-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:#F5C9A0;}
.option-card:active{transform:translateY(-1px) scale(.98);}
.option-card.selected{border-color:var(--orange);background:var(--orange-light);box-shadow:var(--shadow-orange);}
.option-icon-wrap{width:56px;height:56px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;transition:background .2s ease;flex-shrink:0;}
.option-card.selected .option-icon-wrap{background:#fff;}
.option-icon-wrap svg{width:30px;height:30px;color:var(--text);}
.option-card.selected .option-icon-wrap svg{color:var(--orange);}
.option-name{font-weight:600;font-size:13.5px;color:var(--text);line-height:1.25;}
.option-desc{font-size:11.5px;color:var(--text-muted);}
.check-badge{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.5);transition:all .2s cubic-bezier(.34,1.56,.64,1);}
.option-card.selected .check-badge{opacity:1;transform:scale(1);}
.check-badge svg{width:11px;height:11px;stroke:#fff;stroke-width:3.4;}

/* compact cards (brand / small) */
.option-card.compact{padding:14px 10px;flex-direction:row;gap:10px;text-align:left;}
.option-card.compact .option-icon-wrap{width:38px;height:38px;border-radius:10px;}
.option-card.compact .option-icon-wrap svg{width:20px;height:20px;}
.brand-badge{width:38px;height:38px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:13px;color:var(--text-muted);flex-shrink:0;}
.option-card.selected .brand-badge{background:#fff;color:var(--orange);}

/* wide row cards (service / slots / areas) */
.row-card{
  position:relative;background:#fff;border:1.5px solid var(--border);border-radius:var(--r-lg);
  padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;
  transition:transform .15s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
}
.row-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:#F5C9A0;}
.row-card.selected{border-color:var(--orange);background:var(--orange-light);box-shadow:var(--shadow-orange);}
.row-icon{width:44px;height:44px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.row-icon svg{width:24px;height:24px;color:var(--text);}
.row-card.selected .row-icon{background:#fff;}
.row-card.selected .row-icon svg{color:var(--orange);}
.row-body{flex:1;min-width:0;}
.row-title{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;}
.row-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.row-price{font-family:'Sora';font-weight:700;font-size:14px;color:var(--text);white-space:nowrap;}
.badge-rec{font-size:10px;font-weight:700;color:var(--orange-dark);background:var(--orange-light);padding:3px 8px;border-radius:99px;letter-spacing:.02em;text-transform:uppercase;}
.row-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s ease;}
.row-card.selected .row-check{background:var(--orange);border-color:var(--orange);}
.row-check svg{width:12px;height:12px;stroke:#fff;stroke-width:3.4;opacity:0;transform:scale(.5);transition:all .2s ease;}
.row-card.selected .row-check svg{opacity:1;transform:scale(1);}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-weight:600;font-size:14.5px;padding:13px 22px;border:none;cursor:pointer;transition:transform .12s ease, box-shadow .2s ease, opacity .2s ease, background .2s ease;white-space:nowrap;}
.btn-primary{background:var(--orange);color:#fff;box-shadow:var(--shadow-orange);}
.btn-primary:hover{background:var(--orange-dark);transform:translateY(-1px);}
.btn-primary:active{transform:translateY(0) scale(.98);}
.btn-primary:disabled{opacity:.42;box-shadow:none;cursor:not-allowed;transform:none;}
.btn-secondary{background:#fff;color:var(--text);border:1.5px solid var(--border-strong);}
.btn-secondary:hover{border-color:var(--text-faint);transform:translateY(-1px);}
.btn-text{background:transparent;color:var(--text-muted);padding:13px 10px;}
.btn-text:hover{color:var(--orange-dark);}
.btn svg{width:16px;height:16px;}

/* ---------- Footer nav ---------- */
.flow-footer{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--border);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -12px rgba(20,20,25,.12);
}
.flow-footer-inner{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:10px;}
.mobile-mini-summary{flex:1;min-width:0;display:flex;align-items:center;gap:10px;overflow:hidden;}
.mms-icon{width:34px;height:34px;border-radius:9px;background:var(--orange-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mms-icon svg{width:18px;height:18px;color:var(--orange);}
.mms-text{min-width:0;}
.mms-label{font-size:10.5px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
.mms-value{font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media (min-width:960px){
  .flow-footer{position:static;border-top:none;box-shadow:none;background:transparent;padding:28px 0 0;}
  .mobile-mini-summary{display:none;}
}

/* ---------- Summary sidebar (desktop) ---------- */
.summary-side{position:sticky;top:calc(var(--header-h) + 84px);display:none;}
@media (min-width:960px){ .summary-side{display:block;} }
.summary-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);}
.summary-card-head{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:between;gap:10px;}
.summary-card-head h3{margin:0;font-size:15px;}
.summary-list{padding:6px 8px;}
.summary-row{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border-radius:10px;}
.summary-row + .summary-row{border-top:1px dashed var(--border);}
.sr-icon{width:30px;height:30px;border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.sr-icon svg{width:16px;height:16px;color:var(--text-muted);}
.summary-row.filled .sr-icon{background:var(--orange-light);}
.summary-row.filled .sr-icon svg{color:var(--orange);}
.sr-body{min-width:0;flex:1;}
.sr-label{font-size:11px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
.sr-value{font-size:13.5px;font-weight:600;color:var(--text-faint);margin-top:2px;}
.summary-row.filled .sr-value{color:var(--text);}
.summary-card-foot{padding:16px 20px;background:var(--surface);border-top:1px solid var(--border);}
.est-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.est-label{font-size:12.5px;color:var(--text-muted);}
.est-value{font-family:'Sora';font-weight:700;font-size:16px;}
.est-note{font-size:11px;color:var(--text-faint);}
.trust-mini{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px 18px;}
.trust-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);background:var(--surface);padding:6px 10px;border-radius:99px;}
.trust-pill svg{width:13px;height:13px;color:var(--orange);}

/* ---------- Form fields ---------- */
.field-group{margin-bottom:18px;}
.field-label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;}
.field-hint{font-size:12px;color:var(--text-faint);margin-top:6px;}
.text-input{width:100%;padding:13px 14px;border:1.5px solid var(--border-strong);border-radius:12px;font-size:15px;font-family:inherit;color:var(--text);background:#fff;transition:border-color .18s ease, box-shadow .18s ease;}
.text-input:focus{border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-glow);outline:none;}
.phone-input-row{display:flex;gap:8px;}
.phone-prefix{display:flex;align-items:center;justify-content:center;padding:0 14px;border:1.5px solid var(--border-strong);border-radius:12px;font-weight:600;color:var(--text-muted);background:var(--surface);}
.chip-row{display:flex;flex-wrap:wrap;gap:9px;}
.chip{padding:9px 15px;border-radius:99px;border:1.5px solid var(--border-strong);background:#fff;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;transition:all .18s ease;}
.chip:hover{border-color:var(--orange);}
.chip.selected{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:var(--shadow-orange);}
.location-btn{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border-radius:12px;border:1.5px dashed var(--border-strong);background:var(--surface-2);font-weight:600;font-size:14px;color:var(--orange-dark);cursor:pointer;margin-bottom:20px;transition:all .18s ease;}
.location-btn:hover{border-color:var(--orange);background:var(--orange-light);}
.location-btn svg{width:19px;height:19px;color:var(--orange);flex-shrink:0;}
.location-btn.active{border-style:solid;border-color:var(--success);background:var(--success-bg);color:#0F7C3E;}
.location-btn.active svg{color:var(--success);}

/* date strip */
.date-strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.date-strip::-webkit-scrollbar{display:none;}
.date-chip{flex-shrink:0;width:64px;padding:12px 0;border-radius:14px;border:1.5px solid var(--border);background:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:all .18s ease;}
.date-chip:hover{border-color:#F5C9A0;transform:translateY(-2px);}
.date-chip.selected{background:var(--orange);border-color:var(--orange);box-shadow:var(--shadow-orange);}
.dc-day{font-size:11px;color:var(--text-faint);font-weight:600;text-transform:uppercase;}
.date-chip.selected .dc-day{color:rgba(255,255,255,.85);}
.dc-num{font-family:'Sora';font-size:19px;font-weight:700;}
.date-chip.selected .dc-num{color:#fff;}
.dc-mon{font-size:10px;color:var(--text-faint);}
.date-chip.selected .dc-mon{color:rgba(255,255,255,.85);}

.emergency-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r-lg);background:linear-gradient(135deg,#1A1A1E,#2B2B31);color:#fff;margin-bottom:18px;cursor:pointer;border:1.5px solid transparent;transition:all .2s ease;}
.emergency-card:hover{transform:translateY(-2px);}
.emergency-card.selected{border-color:var(--orange);box-shadow:var(--shadow-orange);}
.emergency-icon{width:44px;height:44px;border-radius:12px;background:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.emergency-icon svg{width:22px;height:22px;stroke:#fff;fill:#fff;}
.emergency-title{font-weight:700;font-size:14.5px;}
.emergency-sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:2px;}
.emergency-check{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.emergency-card.selected .emergency-check{background:var(--orange);border-color:var(--orange);}
.emergency-check svg{width:11px;height:11px;stroke:#fff;stroke-width:3.4;opacity:0;}
.emergency-card.selected .emergency-check svg{opacity:1;}

/* OTP */
.otp-row{display:flex;gap:10px;margin:6px 0 4px;}
.otp-box{width:52px;height:58px;text-align:center;font-size:22px;font-weight:700;font-family:'Sora';border:1.5px solid var(--border-strong);border-radius:12px;background:#fff;transition:all .15s ease;}
.otp-box:focus{border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-glow);outline:none;}
.otp-box.error{border-color:var(--danger);animation:shake .35s ease;}
.otp-box.success{border-color:var(--success);background:var(--success-bg);}
@keyframes shake{10%,90%{transform:translateX(-1px);}20%,80%{transform:translateX(2px);}30%,50%,70%{transform:translateX(-4px);}40%,60%{transform:translateX(4px);}}
.otp-error-msg{display:flex;align-items:center;gap:7px;color:var(--danger);background:var(--danger-bg);font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:10px;margin-top:10px;}
.otp-error-msg svg{width:15px;height:15px;flex-shrink:0;}
.otp-success-msg{display:flex;align-items:center;gap:7px;color:var(--success);background:var(--success-bg);font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:10px;margin-top:10px;}
.otp-success-msg svg{width:15px;height:15px;flex-shrink:0;}
.otp-meta{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:13px;}
.resend-link{background:none;border:none;color:var(--orange-dark);font-weight:600;cursor:pointer;font-size:13px;}
.resend-link:disabled{color:var(--text-faint);cursor:default;}
.contact-verified-chip{display:flex;align-items:center;gap:8px;background:var(--success-bg);color:#0F7C3E;padding:10px 14px;border-radius:12px;font-weight:600;font-size:13.5px;margin-top:14px;}
.contact-verified-chip svg{width:16px;height:16px;}
.demo-hint{font-size:11.5px;color:var(--text-faint);background:var(--surface);border:1px dashed var(--border-strong);padding:8px 11px;border-radius:9px;margin-top:14px;}

/* Summary screen (step 9) */
.summary-screen-grid{display:grid;grid-template-columns:1fr;gap:14px;}
.sum-block{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;display:flex;align-items:center;gap:14px;}
.sum-block .row-icon{background:var(--orange-light);}
.sum-block .row-icon svg{color:var(--orange);}
.sum-block .row-body{flex:1;}

.success-check::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--success);opacity:.35;animation:pulse-ring 1.8s ease-out infinite;}

function renderProgress(){
  const pct=Math.round(((stepIndex+1)/TOTAL_STEPS)*100);
  document.getElementById('progressLabel').textContent=`Step ${stepIndex+1} of ${TOTAL_STEPS}`;
  document.getElementById('progressPct').textContent=pct+'%';
  document.getElementById('progressFill').style.width=pct+'%';
  const nodesWrap=document.getElementById('stepNodes');
  nodesWrap.style.setProperty('--fill', `${(stepIndex/(TOTAL_STEPS-1))*100}%`);
  nodesWrap.innerHTML=STEP_META.map((s,i)=>{
    const st = i<stepIndex?'done':(i===stepIndex?'active':'');
    return `<div class="step-node ${st}"><div class="node-dot">${i<stepIndex?checkIcon():(i+1)}</div><div class="node-label">${s.label}</div></div>`;

}

/* =========================================================
   VALIDATION per step
   ========================================================= */
function canProceed(){
  switch(stepIndex){
    case 0: return !!state.category;
    case 1: return !!state.applianceType;
    case 2: return true; // brand optional/skippable
    case 3: return !!state.problem;
    case 4: return !!state.service;
    case 5: return !!(state.location.area || state.location.useCurrent) ;
    case 6: return !!(state.time && (state.date || state.time==='emergency'));
    case 7: return !!state.contact.verified;
    case 8: return true;
    default: return true;
  }
}

function nextDates(n){
  const out=[]; const today=new Date();
  for(let i=0;i<n;i++){
    const d=new Date(today); d.setDate(today.getDate()+i);
    out.push({
      key:d.toISOString().slice(0,10),
      day: i===0?'Today':i===1?'Tmrw':d.toLocaleDateString('en-US',{weekday:'short'}),
      num: d.getDate(),
      mon: d.toLocaleDateString('en-US',{month:'short'}),
      label: i===0?'Today': i===1?'Tomorrow': d.toLocaleDateString('en-US',{weekday:'short', day:'numeric', month:'short'})
    });
  }
  return out;
}

   ========================================================= */
const RENDERERS=[renderStepCategory,renderStepType,renderStepBrand,renderStepProblem,renderStepService,renderStepLocation,renderStepDatetime,renderStepContact,renderStepSummary];

function render(){
  document.querySelector('.progress-wrap').style.display='';
  document.querySelector('.summary-side').style.display='';
  const content=document.getElementById('stepContent');
  content.classList.remove('fade-in'); void content.offsetWidth; content.classList.add('fade-in');
  content.innerHTML=RENDERERS[stepIndex]();

  wireOtpBoxesIfPresent();

/* =========================================================
   EVENT DELEGATION
   ========================================================= */
document.addEventListener('click', function(e){
  const t=e.target.closest('[data-action]');
  if(!t) return;
  const action=t.dataset.action, value=t.dataset.value;
  handleAction(action, value, t);
});
document.addEventListener('keydown', function(e){
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="radio"][data-action]')){
    e.preventDefault();
    handleAction(e.target.dataset.action, e.target.dataset.value, e.target);
  }
});
document.addEventListener('input', function(e){
  if(e.target.dataset && e.target.dataset.action==='type-address'){ state.location.address=e.target.value; }
  if(e.target.dataset && e.target.dataset.action==='type-name'){ state.contact.name=e.target.value; }
  if(e.target.dataset && e.target.dataset.action==='type-phone'){ state.contact.phone=e.target.value.replace(/[^0-9]/g,'').slice(0,10); e.target.value=state.contact.phone; }
});

function handleAction(action,value,el){
  switch(action){
    case 'select-category':
      state.category=value; state.applianceType=null; break;
    case 'select-type':
      state.applianceType=value; break;
    case 'select-brand':
      state.brand=(state.brand===value)?null:value; break;
    case 'select-problem':
      state.problem=value; state.service=null; break;
    case 'select-service':
      state.service=value; break;
    case 'use-current-location':
      state.location.useCurrent=!state.location.useCurrent;
      if(state.location.useCurrent) state.location.area=null;
      break;
    case 'select-area':
      state.location.area=(state.location.area===value)?null:value;
      if(state.location.area) state.location.useCurrent=false;
      break;
    case 'select-emergency':
      if(state.time==='emergency'){ state.time=null; } else { state.time='emergency'; state.date=null; state.dateLabel='Any day'; }
      break;
    case 'select-date':
      state.date=value; state.dateLabel=el.dataset.label; if(state.time==='emergency') state.time=null; break;
    case 'select-time':
      state.time=value; break;
    case 'send-otp':
      if(!validateContactForm()) return;
      state.contact.stage='otp'; state.contact.otp=['','','',''];
      startResendTimer();
      break;
    case 'resend-otp':
      state.contact.otp=['','','',''];state.contact.error=false; startResendTimer();
      render(); focusFirstOtp(); return;
    case 'verify-otp':
      verifyOtp(); return;
    case 'back':
      if(stepIndex>0){ stepIndex--; render(); } return;
    case 'skip':
      if(stepIndex<8){ stepIndex++; render(); } return;
    case 'jump':
      stepIndex=parseInt(value,10); render(); return;
    case 'next':
      if(!canProceed()) return;
      if(stepIndex===8){ renderSuccess(); return; }
      stepIndex++; render(); return;
    case 'restart':
      Object.assign(state,{category:null,applianceType:null,brand:null,problem:null,service:null,
        location:{useCurrent:false,area:null,address:''},date:null,dateLabel:null,time:null,
        contact:{name:'',phone:'',stage:'form',otp:['','','',''],attempts:0,error:false,verified:false,timer:30}});
      bookingId=''; stepIndex=0; render(); return;
    default: return;
  }
  render();
}

function validateContactForm(){
  const nameOk=state.contact.name.trim().length>1;
  const phoneOk=state.contact.phone.length===10;
  if(!nameOk){ document.getElementById('nameInput')?.focus(); return false; }
  if(!phoneOk){ document.getElementById('phoneInput')?.focus(); return false; }
  return true;
}

function startResendTimer(){
  clearInterval(resendTimerHandle);
  state.contact.timer=30;
  resendTimerHandle=setInterval(()=>{
    state.contact.timer--;
    const btn=document.querySelector('[data-action="resend-otp"]');
    if(btn){ btn.textContent = state.contact.timer>0? `Resend OTP in 0:${state.contact.timer<10?'0':''}${state.contact.timer}` : 'Resend OTP'; btn.disabled = state.contact.timer>0; }
    if(state.contact.timer<=0) clearInterval(resendTimerHandle);
  },1000);
}

function wireOtpBoxesIfPresent(){
  const boxes=document.querySelectorAll('.otp-box');
  if(!boxes.length) return;
  boxes.forEach((box,i)=>{
    box.addEventListener('input',()=>{
      const v=box.value.replace(/[^0-9]/g,'').slice(0,1);
      box.value=v; state.contact.otp[i]=v; state.contact.error=false;
      box.classList.remove('error');
      if(v && boxes[i+1]) boxes[i+1].focus();
    });
    box.addEventListener('keydown',(e)=>{
      if(e.key==='Backspace' && !box.value && boxes[i-1]) boxes[i-1].focus();
      if(e.key==='Enter') verifyOtp();
    });
  });
  focusFirstOtp();
}
function focusFirstOtp(){
  const first=document.getElementById('otp0');
  if(first) first.focus();
}

function verifyOtp(){
  const code=state.contact.otp.join('');
  if(code.length<4) return;
  if(code==='1234'){
    state.contact.verified=true; state.contact.error=false; state.contact.stage='verified';
    clearInterval(resendTimerHandle);
    render();
  } else {
    state.contact.error=true; state.contact.attempts++;
    render();
    setTimeout(()=>{ state.contact.otp=['','','','']; document.querySelectorAll('.otp-box').forEach(b=>b.value=''); focusFirstOtp(); },650);
  }
}

/* init */
render();
</script>
</body>
</html>
